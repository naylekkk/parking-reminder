name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler l'app (non signée)
        run: |
          xcodebuild \
            -project ParkingReminder.xcodeproj \
            -scheme ParkingReminder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Créer le fichier .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ParkingReminder.app Payload/
          zip -qry ParkingReminder.ipa Payload

      - name: Publier le .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ParkingReminder-ipa
          path: ParkingReminder.ipa
