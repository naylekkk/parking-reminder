name: ParkingReminder
options:
  bundleIdPrefix: com.kelyan
  deploymentTarget:
    iOS: "16.0"
targets:
  ParkingReminder:
    type: application
    platform: iOS
    sources: [ParkingReminder]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kelyan.parkingreminder
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parking
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Pour détecter ton arrivée au parking."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Pour te rappeler de payer le parking même quand l'app est fermée."
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
